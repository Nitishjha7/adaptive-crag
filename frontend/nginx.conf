server {
    listen 80;

    # React build — static files
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path goes to index.html, never a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* proxies to the backend container. This is why the frontend code
    # always writes a relative "/api/query" — no hardcoded backend URL, so
    # nothing needs rebuilding on deploy.
    # "backend" is the compose network's service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # CRAG's correction path makes 4-5 LLM/search calls — the default 60s
        # timeout sometimes falls short of that.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
