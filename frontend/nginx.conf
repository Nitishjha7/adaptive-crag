server {
    listen 80;

    # React build — static files
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: koi bhi unknown path index.html pe jaye, 404 nahi.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* backend container pe proxy. Isi wajah se frontend code me hamesha
    # relative "/api/query" likha hai — koi hardcoded backend URL nahi, isliye
    # deploy pe kuch rebuild nahi karna padta.
    # "backend" compose network ka service name hai.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # CRAG ka correction path 4-5 LLM/search calls karta hai — default 60s
        # timeout us par kabhi kabhi kam pad jaata hai.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
