# Adaptive CRAG — backend + frontend.
#
#   copy .env.example .env    <- fill in GROQ_API_KEY
#   docker compose up --build
#
# Frontend: http://localhost:3001   (Nginx, proxies /api/ to the backend)
# Backend:  http://localhost:8001/docs
#
# Ports are 3001/8001 rather than 3000/8000 because other projects on this
# machine hold those. Override with FRONTEND_PORT / BACKEND_PORT in `.env`.

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      # One-line corpus switch: `CORPUS=scifact docker compose up -d`.
      # `environment` wins over `env_file`, and the default stays concepts —
      # otherwise changing corpus means editing .env every time.
      CORPUS: ${CORPUS:-concepts}
    volumes:
      # Persist the Chroma index, or every container start re-embeds the whole
      # corpus — slow and pointless.
      - ./backend/vectorstore:/app/vectorstore
    healthcheck:
      # /health deliberately makes no LLM call, so this is cheap and a rate
      # limit can never mark the container unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      # `service_healthy`, not `service_started`. It was `started` once, and that
      # caused a real bug: Nginx came up before uvicorn had bound, so the first
      # query right after `docker compose up` returned a 502.
      # /health makes no LLM call, so this check is cheap and reliable.
      backend:
        condition: service_healthy
    restart: unless-stopped
