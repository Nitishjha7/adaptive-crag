# Adaptive CRAG — backend + frontend.
#
#   copy .env.example .env    <- fill in GROQ_API_KEY
#   docker compose up --build
#
# Frontend: http://localhost:3001   (Nginx, proxies /api/ to the backend)
# Backend:  http://localhost:8001/docs
#
# Ports are 3001/8001 because other projects on this machine hold 3000/8000.
# Override with FRONTEND_PORT / BACKEND_PORT in `.env`.

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      # One-line corpus switch: `CORPUS=scifact docker compose up -d`.
      # `environment` wins over `env_file`, so the default stays concepts.
      CORPUS: ${CORPUS:-concepts}
    volumes:
      # Persist the Chroma index; otherwise every start re-embeds the corpus.
      - ./backend/vectorstore:/app/vectorstore
    healthcheck:
      # /health makes no LLM call, so a rate limit cannot mark the container
      # unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      # service_healthy, not service_started: Nginx coming up before uvicorn has
      # bound returns a 502 on the first query after `docker compose up`.
      backend:
        condition: service_healthy
    restart: unless-stopped
