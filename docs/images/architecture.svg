<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/>
    </marker>
    <style>
      .b  { fill:#0f172a; stroke:#334155; rx:8 }
      .bi { fill:#1e1b4b; stroke:#4f46e5; rx:8 }
      .bg { fill:#052e2b; stroke:#0d9488; rx:8 }
      .bw { fill:#1c1917; stroke:#57534e; rx:8 }
      .t  { fill:#e2e8f0; font-size:13px; font-weight:600 }
      .s  { fill:#94a3b8; font-size:10.5px }
      .l  { fill:#64748b; font-size:10px; font-style:italic }
      .e  { stroke:#64748b; stroke-width:1.4; fill:none; marker-end:url(#a) }
      .em { stroke:#818cf8; stroke-width:1.6; fill:none; marker-end:url(#am) }
    </style>
  </defs>

  <rect width="1000" height="300" fill="#020617"/>

  <!-- question -->
  <rect class="b" x="12" y="74" width="88" height="44"/>
  <text class="t" x="56" y="93" text-anchor="middle">Question</text>
  <text class="s" x="56" y="108" text-anchor="middle">/api/query</text>

  <path class="e" d="M100 96 H112"/>

  <!-- retrieve -->
  <rect class="b" x="112" y="58" width="156" height="76"/>
  <text class="t" x="190" y="79" text-anchor="middle">retrieve</text>
  <text class="s" x="190" y="95" text-anchor="middle">vector + BM25 → RRF</text>
  <text class="s" x="190" y="109" text-anchor="middle">cross-encoder rerank</text>
  <text class="s" x="190" y="123" text-anchor="middle">no LLM call</text>

  <path class="e" d="M268 96 H282"/>

  <!-- grade: the one LLM judgement -->
  <rect class="bi" x="282" y="64" width="150" height="64"/>
  <text class="t" x="357" y="85" text-anchor="middle">grade_documents</text>
  <text class="s" x="357" y="100" text-anchor="middle">binary: yes / no</text>
  <text class="s" x="357" y="114" text-anchor="middle">temp 0 · one word</text>

  <!-- relevant -->
  <path class="em" d="M432 96 H616"/>
  <text class="l" x="524" y="88" text-anchor="middle">relevant → answer locally</text>

  <!-- not relevant -->
  <path class="em" d="M357 128 V204"/>
  <text class="l" x="368" y="155">not relevant →</text>
  <text class="l" x="368" y="169">correct instead of guessing</text>

  <!-- transform -->
  <rect class="bw" x="282" y="204" width="150" height="56"/>
  <text class="t" x="357" y="225" text-anchor="middle">transform_query</text>
  <text class="s" x="357" y="241" text-anchor="middle">prose → keywords</text>
  <text class="s" x="357" y="254" text-anchor="middle">+1 LLM call</text>

  <path class="e" d="M432 232 H452"/>

  <!-- web search -->
  <rect class="bw" x="452" y="204" width="150" height="56"/>
  <text class="t" x="527" y="225" text-anchor="middle">web_search</text>
  <text class="s" x="527" y="241" text-anchor="middle">DuckDuckGo · no key</text>
  <text class="s" x="527" y="254" text-anchor="middle">replaces the docs</text>

  <path class="e" d="M602 232 H660 V128"/>

  <!-- generate -->
  <rect class="b" x="616" y="66" width="140" height="60"/>
  <text class="t" x="686" y="87" text-anchor="middle">generate</text>
  <text class="s" x="686" y="102" text-anchor="middle">grounded strictly</text>
  <text class="s" x="686" y="116" text-anchor="middle">in verified context</text>

  <path class="e" d="M756 96 H772"/>

  <!-- guardrails -->
  <rect class="b" x="772" y="66" width="150" height="60"/>
  <text class="t" x="847" y="87" text-anchor="middle">validate_guardrails</text>
  <text class="s" x="847" y="102" text-anchor="middle">groundedness check</text>
  <text class="s" x="847" y="116" text-anchor="middle">+ PII redaction</text>

  <path class="e" d="M847 126 V196"/>

  <!-- answer -->
  <rect class="bg" x="772" y="196" width="150" height="52"/>
  <text class="t" x="847" y="217" text-anchor="middle">Answer + trace</text>
  <text class="s" x="847" y="233" text-anchor="middle">source badge · citations</text>

  <!-- cost note -->
  <text class="l" x="12" y="278">Local route: 3 LLM calls.  Correction route: 4 — the extra call is the whole cost of being adaptive, and it is only paid when the grader says the corpus falls short.</text>
</svg>
