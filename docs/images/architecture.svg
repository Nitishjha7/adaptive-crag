<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360"
     font-family="Inter, ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1120" height="360" fill="#080b14"/>

  <!-- question -->
  <rect x="24" y="150" width="112" height="56" rx="10" fill="#0f1528" stroke="#1c2540"/>
  <text x="80" y="177" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle">Question</text>
  <text x="80" y="193" fill="#64748b" font-size="10.5" text-anchor="middle">or uploaded PDF</text>

  <!-- retrieve -->
  <rect x="180" y="142" width="150" height="72" rx="10" fill="#0f1528" stroke="#1c2540"/>
  <text x="255" y="167" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Retrieve</text>
  <text x="255" y="185" fill="#94a3b8" font-size="10.5" text-anchor="middle">vector + BM25, RRF</text>
  <text x="255" y="200" fill="#64748b" font-size="10.5" text-anchor="middle">cross-encoder rerank</text>

  <!-- grade -->
  <rect x="374" y="142" width="142" height="72" rx="10" fill="#141b31" stroke="#4f46e5"/>
  <text x="445" y="167" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Grade</text>
  <text x="445" y="185" fill="#94a3b8" font-size="10.5" text-anchor="middle">is this context</text>
  <text x="445" y="200" fill="#94a3b8" font-size="10.5" text-anchor="middle">enough? yes / no</text>

  <!-- correction branch -->
  <rect x="560" y="36" width="150" height="66" rx="10" fill="#0f1528" stroke="#78350f"/>
  <text x="635" y="61" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">Rewrite query</text>
  <text x="635" y="80" fill="#94a3b8" font-size="10.5" text-anchor="middle">into search keywords</text>

  <rect x="754" y="36" width="150" height="66" rx="10" fill="#0f1528" stroke="#78350f"/>
  <text x="829" y="61" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">Web search</text>
  <text x="829" y="80" fill="#94a3b8" font-size="10.5" text-anchor="middle">replaces the documents</text>

  <!-- generate -->
  <rect x="754" y="142" width="150" height="72" rx="10" fill="#0f1528" stroke="#1c2540"/>
  <text x="829" y="167" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Generate</text>
  <text x="829" y="185" fill="#94a3b8" font-size="10.5" text-anchor="middle">answer from context</text>
  <text x="829" y="200" fill="#64748b" font-size="10.5" text-anchor="middle">with citations</text>

  <!-- validate -->
  <rect x="948" y="142" width="148" height="72" rx="10" fill="#0f1528" stroke="#1c2540"/>
  <text x="1022" y="167" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Validate</text>
  <text x="1022" y="185" fill="#94a3b8" font-size="10.5" text-anchor="middle">groundedness check</text>
  <text x="1022" y="200" fill="#64748b" font-size="10.5" text-anchor="middle">PII redaction</text>

  <!-- edges -->
  <path d="M136 178 H172" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M330 178 H366" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- yes -->
  <path d="M516 178 H746" stroke="#34d399" stroke-width="1.6" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="631" y="170" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">yes</text>
  <text x="631" y="195" fill="#64748b" font-size="10" text-anchor="middle">3 LLM calls</text>

  <!-- no -->
  <path d="M445 142 V79 H552" stroke="#fbbf24" stroke-width="1.6" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="470" y="100" fill="#fbbf24" font-size="11" font-weight="600">no</text>
  <path d="M710 69 H746" stroke="#fbbf24" stroke-width="1.6" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M829 102 V134" stroke="#fbbf24" stroke-width="1.6" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="866" y="122" fill="#64748b" font-size="10">4 LLM calls</text>

  <path d="M904 178 H940" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- caption -->
  <text x="24" y="276" fill="#64748b" font-size="11.5">
    The grader runs before generation, so an answer is never written from context the system has already judged insufficient.
  </text>
  <text x="24" y="296" fill="#64748b" font-size="11.5">
    Measured: 0 missed fallbacks on both evaluation sets.
  </text>
</svg>
